name: Build

on:
  push:
  pull_request:

jobs:
  # Same check as the .githooks/pre-commit hook, for pushes that bypassed it
  # (or clones that never ran `make hooks`).
  fmt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"

      # ocamlformat output is version-dependent, so pin to the version in
      # .ocamlformat rather than hardcoding it a third time. Only the formatter
      # is needed: `dune build @fmt` does not build any of the project's code,
      # so the (heavier) Spot depext setup below is not required here.
      - name: Install ocamlformat
        run: |
          version=$(sed -n 's/^version *= *//p' .ocamlformat)
          opam install dune "ocamlformat.$version"

      - name: Check formatting
        run: opam exec -- make fmt-check

  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          # Not ubuntu-latest (24.04): Spot's Debian packages are built for
          # Debian stable, and libspot-dev pulls in libspotltsmin0, which
          # needs libltdl7 >= 2.5.4. Noble only has 2.4.7, so apt cannot
          # satisfy the depext there. 26.04 ships libltdl7 2.5.4.
          - ubuntu-26.04
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Spot is not packaged by Debian/Ubuntu, so the libspot-dev depext
      # declared in cyclist.opam can only be satisfied from Spot's own
      # repository (as in the Dockerfile). On macOS, the depext is satisfied
      # by the homebrew formula, which needs no extra setup here.
      - name: Add the Spot apt repository
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://www.lrde.epita.fr/repo/debian.gpg \
            | sudo tee /usr/share/keyrings/lrde.gpg > /dev/null
          echo 'deb [signed-by=/usr/share/keyrings/lrde.gpg] http://www.lrde.epita.fr/repo/debian/ stable/' \
            | sudo tee /etc/apt/sources.list.d/lrde.list
          sudo apt-get update

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"

      # Runs `dune build -p cyclist @install @runtest`, which is a different
      # target set from the dev build below: the release profile, the install
      # stanzas and the test suite. It is also the only check that catches
      # dependencies the dune files fail to declare (C++ headers, say), since
      # a dev build copies the whole source tree into _build and so finds
      # undeclared files by accident.
      - name: Install and test
        run: opam install . --with-test

      # The default alias additionally covers the targets @install skips,
      # namely the soundness test executables and the sltop toplevel.
      # `cyclist --help` is not exercised here; see the help smoke test in
      # tests/cli.
      - name: Build
        run: opam exec -- dune build
